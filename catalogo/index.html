<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/faviconis.png" type="image/x-icon">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Botão de alternância do modo noturno -->
        <button id="modo-noturno-btn" class="modo-noturno-btn">
            <i class="fas fa-moon"></i> <!-- Ícone de lua -->
        </button>

        <img src="imagens/logo.png" alt="Logo da Loja" class="logo">

        <!-- Barra de pesquisa -->
        <input type="text" id="barra-pesquisa" placeholder="O que você deseja?" class="barra-pesquisa">

        <!-- Catálogo de produtos -->
        <div id="catalogo"></div>
    </div>

    <!-- Biblioteca Fuse.js para busca aproximada -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

    <!-- Link para o arquivo JavaScript -->
    <script src="main.js"></script>
</body>
</html>
