<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/faviconis.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <img src="imagens/logo.png" alt="Logo da Loja" class="logo">

        <!-- Barra de pesquisa -->
        <input type="text" id="barra-pesquisa" placeholder="Pesquise por nome ou descrição..." class="barra-pesquisa">

        <!-- Catálogo de produtos -->
        <div id="catalogo"></div>
    </div>

    <!-- Biblioteca Fuse.js para busca aproximada -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

    <!-- Link para o arquivo JavaScript -->
    <script src="main.js"></script>
</body>
</html>
