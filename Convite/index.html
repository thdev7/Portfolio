<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Festa do Davi!</title>
  <style>
    /* Reset e base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #fbc2eb, #a6c1ee);
      color: #333;
      text-align: center;
      padding: 5vw;
      overflow-x: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    body {
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 6vw;
      margin: 4vw 0 2vw;
    }

    p {
      font-size: 4.5vw;
      margin-bottom: 3vw;
    }

    .balao {
      font-size: 10vw;
      animation: flutuar 3s ease-in-out infinite;
    }

    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    button {
      background: #ff69b4;
      color: white;
      padding: 4vw 6vw;
      border: none;
      border-radius: 8px;
      font-size: 4.5vw;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 5vw;
    }

    button:hover {
      background: #ff85c1;
    }

    #convite {
      display: none;
      margin-top: 5vw;
    }

    #mensagemConfirmacao {
      font-size: 6vw;
      color: #ff1493;
      font-weight: bold;
      display: none;
      margin-top: 4vw;
      animation: aparecerZoom 0.8s ease forwards;
    }

    @keyframes aparecerZoom {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .balao-flutuante {
      position: fixed;
      bottom: 0;
      font-size: 2em;
      animation: subirBalao 4s linear forwards;
      z-index: 999;
      pointer-events: none;
      opacity: 0.9;
    }

    @keyframes subirBalao {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }

    @media (min-width: 768px) {
      h1 { font-size: 2.5em; }
      p { font-size: 1.2em; }
      button { font-size: 1em; padding: 15px 25px; }
      .balao { font-size: 3em; }
      #mensagemConfirmacao { font-size: 2em; }
    }
  </style>
</head>
<body>

  <button id="btnReceberConvite">🎉 Receber Convite</button>

  <audio id="musica" loop>
    <source src="parabens.mp3.mpeg" type="audio/mpeg" />
    Seu navegador não suporta áudio.
  </audio>

  <div id="convite">
    <div class="balao">🎈🎈🎈</div>
    <h1>Você está convidado!</h1>
    <p>
      É aniversário do <strong>Davi</strong>! E a sua presença vai deixar tudo ainda
      mais especial! 🥳
    </p>
    <p>
      <strong>📅 Data:</strong> 11 de Julho<br />
      <strong>🕒 Horário:</strong> 18h<br />
      <strong>📍 Local:</strong> A Combinar
    </p>

    <button id="confirmarBtn">Confirmar Presença</button>
    <div id="mensagemConfirmacao">🎉 Presença Confirmada! 🎉</div>
  </div>

  <script>
    const btn = document.getElementById("btnReceberConvite");
    const convite = document.getElementById("convite");
    const musica = document.getElementById("musica");
    const confirmarBtn = document.getElementById("confirmarBtn");
    const mensagem = document.getElementById("mensagemConfirmacao");

    btn.addEventListener("click", () => {
      convite.style.display = "block";
      musica.play().catch(() => {
        console.log("O navegador bloqueou o autoplay.");
      });
      btn.style.display = "none";
    });

    confirmarBtn.addEventListener("click", () => {
      mensagem.style.display = "block";
      mensagem.style.animation = "aparecerZoom 0.5s ease";

      for (let i = 0; i < 20; i++) {
        criarBalao(i * 150); // espaça os balões no tempo
      }

      setTimeout(() => {
        mensagem.style.display = "none";
      }, 7000);
    });

    function criarBalao(delay) {
      setTimeout(() => {
        const balao = document.createElement("div");
        balao.classList.add("balao-flutuante");
        balao.innerText = "🎈";
        balao.style.left = `${Math.random() * 90 + 2}vw`;
        balao.style.fontSize = `${Math.random() * 0.5 + 1.5}em`;
        document.body.appendChild(balao);

        setTimeout(() => {
          balao.remove();
        }, 7000);
      }, delay);
    }
  </script>

</body>
</html>
